name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, build, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          # Throwaway credentials for the CI-only test database.
          POSTGRES_USER: casa
          POSTGRES_PASSWORD: casa
          POSTGRES_DB: casa_maderero_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U casa -d casa_maderero_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: casa
      DB_PASSWORD: casa
      TEST_DB_NAME: casa_maderero_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npx eslint "{src,test}/**/*.ts"
      - name: Type check
        run: npx tsc --noEmit -p tsconfig.json
      - name: Build
        run: npm run build
      - name: End-to-end tests
        run: npm run test:e2e

  frontend:
    name: Frontend (lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npx oxlint
      - name: Type check and build
        run: npm run build
